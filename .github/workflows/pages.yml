name: Publish app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build index.html
        run: APP_URL="https://dmchipm.github.io/suu-rugby-prep/" sh build.sh
      - name: Collect site files
        run: mkdir _site && cp index.html version.txt sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png _site/ && mkdir _site/oauth && cp oauth/consent.html _site/oauth/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
